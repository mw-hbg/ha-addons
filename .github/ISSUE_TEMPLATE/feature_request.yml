name: Feature request / Wunsch
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: input
    id: app
    attributes:
      label: Which app? / Welche App?
      placeholder: "Garmin Connect MCP"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like and why?
    validations:
      required: true
