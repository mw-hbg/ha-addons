version: 2
updates:
  # Versions of the GitHub Actions building blocks
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # Base images of all apps (every top-level folder with a Dockerfile)
  - package-ecosystem: docker
    directories: ["/*"]
    schedule:
      interval: monthly
    ignore:
      # Python apps stay on their Python minor version until upgraded deliberately
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
