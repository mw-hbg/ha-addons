version: 2
updates:
  # Versions of the GitHub Actions building blocks
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # Python base image of the app
  - package-ecosystem: docker
    directory: /garmin_mcp
    schedule:
      interval: monthly
    ignore:
      # Stay on Python 3.12 until the Garmin server supports newer versions
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
