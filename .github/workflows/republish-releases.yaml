name: Republish releases under mw-hbg

# One-off, started by hand (Actions → this workflow → Run workflow):
#   1. moves every tag that still points to a commit from before the history
#      was rewritten to the matching new commit on main (same files and same
#      commit message – otherwise it stops without changing anything),
#   2. recreates the releases that github-actions[bot] made under the
#      owner's name (same tag, title and text).
# Uses the owner's RELEASE_TOKEN. Removed again after it ran.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0
          fetch-tags: true
      - name: Move the tags to the rewritten commits
        run: |
          git fetch --force origin 'refs/tags/*:refs/tags/*'
          git log origin/main --format='%H %T %s' > "$RUNNER_TEMP/main.txt"
          : > "$RUNNER_TEMP/moves.txt"
          for tag in $(git tag); do
            old=$(git rev-parse "$tag^{commit}")
            if git merge-base --is-ancestor "$old" origin/main; then
              echo "$tag: already on main"; continue
            fi
            key="$(git rev-parse "$old^{tree}") $(git log -1 --format=%s "$old")"
            new=$(awk -v k="$key" '{h=$1; $1=""; sub(/^ /,""); if ($0==k) print h}' "$RUNNER_TEMP/main.txt")
            if [ "$(echo "$new" | grep -c .)" != "1" ]; then
              echo "::error::$tag: no unique matching commit on main – nothing was changed"; exit 1
            fi
            echo "$tag $new" >> "$RUNNER_TEMP/moves.txt"
            echo "$tag: ${old:0:7} -> ${new:0:7}"
          done
          # all tags checked – only now change anything
          while read -r tag new; do
            git push --force origin "$new:refs/tags/$tag"
          done < "$RUNNER_TEMP/moves.txt"

  republish:
    needs: retag
    uses: mw-hbg/workflows/.github/workflows/releases-as-owner.yml@main
    secrets:
      release-token: ${{ secrets.RELEASE_TOKEN }}
