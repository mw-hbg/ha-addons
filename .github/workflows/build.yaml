name: Test

# Every pull request and every push to main. Nothing is published here;
# releases are made with the "Release" workflow (Actions → Release).
# The steps themselves live in mw-hbg/workflows (shared by all projects).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    uses: mw-hbg/workflows/.github/workflows/ha-app-test.yml@main
    with:
      app: garmin_mcp

  translations:
    uses: mw-hbg/workflows/.github/workflows/translations-check.yml@main
    with:
      groups: |
        garmin_mcp/rootfs/app/i18n/*.json
        garmin_mcp/translations/*.yaml
        garmin_mcp/rootfs/app/integration/garmin_mcp_webhook/strings.json garmin_mcp/rootfs/app/integration/garmin_mcp_webhook/translations/*.json
