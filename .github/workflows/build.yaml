name: Test

# Runs for every pull request and every push to main. Nothing is published
# here – releases are made with the "Release" workflow (Actions → Release).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint add-on configuration
        uses: frenck/action-addon-linter@v2
        with:
          path: ./garmin_mcp

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies (same pinned server as the image)
        run: |
          ref=$(grep -oP '^ARG UPSTREAM_REF=\K\S+' garmin_mcp/Dockerfile)
          pip install "garmin-mcp @ git+https://github.com/Taxuspt/garmin_mcp@${ref}" \
            uvicorn starlette python-multipart aiohttp httpx pytest
      - name: Run tests
        run: pytest -q tests

  build:
    needs: [lint, unit-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.arch }}
        uses: docker/build-push-action@v7
        with:
          context: ./garmin_mcp
          platforms: ${{ matrix.platform }}
          push: false
          load: ${{ matrix.arch == 'amd64' }}
          tags: garmin-mcp-test:${{ matrix.arch }}
          build-args: |
            BUILD_VERSION=test
            BUILD_ARCH=${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke test the image
        if: matrix.arch == 'amd64'
        run: bash tests/smoke_test.sh garmin-mcp-test:amd64
