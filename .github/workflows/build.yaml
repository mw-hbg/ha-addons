name: Build add-on

# Pull requests and pushes to main only build (as a test).
# Publishing a GitHub release "vX.Y.Z" builds and pushes the images that
# Home Assistant downloads. The tag must match "version" in config.yaml.
on:
  pull_request:
    paths: ["garmin_mcp/**", ".github/workflows/build.yaml"]
  push:
    branches: [main]
    paths: ["garmin_mcp/**", ".github/workflows/build.yaml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint add-on configuration
        uses: frenck/action-addon-linter@v2
        with:
          path: ./garmin_mcp

  build:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on metadata
        id: info
        run: |
          version=$(yq -r '.version' garmin_mcp/config.yaml)
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/${{ matrix.arch }}-addon-garmin-mcp"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "release" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check release tag matches config.yaml version
        if: github.event_name == 'release'
        run: |
          if [ "${{ github.event.release.tag_name }}" != "v${{ steps.info.outputs.version }}" ]; then
            echo "::error::Release tag ${{ github.event.release.tag_name }} does not match version ${{ steps.info.outputs.version }} in config.yaml"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.info.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ steps.info.outputs.push == 'true' && ' and push' || '' }} ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: ./garmin_mcp
          platforms: ${{ matrix.platform }}
          push: ${{ steps.info.outputs.push == 'true' }}
          build-args: |
            BUILD_VERSION=${{ steps.info.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          tags: |
            ${{ steps.info.outputs.image }}:${{ steps.info.outputs.version }}
            ${{ steps.info.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
