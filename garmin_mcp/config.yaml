---
name: Garmin Connect MCP
version: "0.3.0"
slug: garmin_mcp
description: >-
  MCP server for Garmin Connect – let AI assistants (Claude, ChatGPT, …)
  read your training and health data and plan workouts on your watch.
url: https://github.com/mw-hbg/ha-addons
# Pre-built images from GitHub Actions. Remove this line to build locally.
image: ghcr.io/mw-hbg/{arch}-addon-garmin-mcp
arch:
  - amd64
  - aarch64
# Apps panel paths (/config/app/...) and the "Apps" naming exist since 2026.2
homeassistant: "2026.2.0"
stage: experimental
ingress: true
homeassistant_api: true
map:
  # Only used to install the small helper integration that provides the
  # webhook (custom_components/garmin_mcp_webhook) and its config file.
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
# Downloaded activity files are only a hand-over to the AI – keep them out of
# Home Assistant backups (tokens, settings and the secret URL stay included).
backup_exclude:
  - downloads
  - "*.tmp"
panel_icon: mdi:run-fast
panel_title: Garmin MCP
ports:
  8100/tcp: null
ports_description:
  8100/tcp: >-
    MCP endpoint for remote_access "direct" (protected by the secret path). Not needed with the default webhook mode.
options:
  tool_areas:
    - all
  write_access: create_only
  enable_tools: []
  disable_tools: []
  remote_access: webhook
  public_url: ""
  keep_downloads_days: 7
  login_notification: true
  log_level: info
schema:
  tool_areas:
    - "list(all|minimal|health|activities|workouts|training|nutrition)"
  write_access: "list(read_only|create_only|full)"
  enable_tools:
    - "str"
  disable_tools:
    - "str"
  remote_access: "list(webhook|direct)"
  public_url: "str?"
  keep_downloads_days: "int(0,365)"
  login_notification: bool
  log_level: "list(debug|info|warning|error)"
