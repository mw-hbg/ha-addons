---
configuration:
  tool_areas:
    name: Bereiche
    description: >-
      Welche Bereiche von Garmin Connect die KI nutzen darf. „all“ gibt alle Tools frei.
      Weniger Bereiche bedeuten weniger Tools – die KI arbeitet dann schneller und gezielter.
  write_access:
    name: Schreibrechte
    description: >-
      read_only = die KI kann nur lesen.
      create_only = die KI darf zusätzlich Workouts anlegen, einplanen, an die Uhr senden und
      Einträge hinzufügen, aber nie etwas löschen oder überschreiben (empfohlen).
      full = erlaubt auch Löschen und Bearbeiten (Aktivitäten, Workouts, Gewicht, …).
  enable_tools:
    name: Einzelne Tools erlauben
    description: >-
      Tool-Namen, die trotz der gewählten Schreibrechte verfügbar sein sollen
      (z. B. set_perceived_effort). Die Liste aller Tools steht in der Dokumentation.
  disable_tools:
    name: Einzelne Tools sperren
    description: Tool-Namen, die nie verfügbar sein sollen (z. B. delete_activity).
  remote_access:
    name: Fernzugriff
    description: >-
      webhook (empfohlen) = erreichbar über deine bestehende Home-Assistant-Adresse
      (Nabu Casa, Cloudflare-Tunnel, Reverse Proxy …), sonst nichts einzurichten. Installiert
      eine kleine Hilfs-Integration; Home Assistant muss einmal neu gestartet werden.
      direct = du leitest einen eigenen HTTPS-Hostnamen auf Port 8100 dieses Add-ons.
  public_url:
    name: Öffentliche Adresse
    description: >-
      Optional. Nur nötig, wenn die Add-on-Seite deine öffentliche Adresse nicht selbst
      ermitteln kann. Webhook: deine Home-Assistant-Adresse, z. B. https://home.example.com.
      Direct: der Hostname, den du auf das Add-on geleitet hast, z. B. https://garmin.example.com.
  log_level:
    name: Protokollstufe
    description: Wie ausführlich das Add-on ins Protokoll schreibt.
network:
  8100/tcp: >-
    MCP-Endpunkt für Fernzugriff „direct“. Beim Standard (webhook) leer lassen.
