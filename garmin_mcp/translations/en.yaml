---
configuration:
  tool_areas:
    name: Tool areas
    description: >-
      Which areas of Garmin Connect the AI may use. "all" exposes every tool.
      Fewer areas mean fewer tools, which keeps the AI faster and more focused.
  write_access:
    name: Write access
    description: >-
      read_only = the AI can only read data.
      create_only = the AI may additionally create and schedule workouts, send them to your watch
      and add entries, but never delete or overwrite anything (recommended).
      full = also allows deleting and editing (activities, workouts, weigh-ins, …).
  enable_tools:
    name: Allow individual tools
    description: >-
      Tool names that should be available even though the write access level blocks them
      (e.g. set_perceived_effort). See the documentation for the tool list.
  disable_tools:
    name: Block individual tools
    description: Tool names that should never be available (e.g. delete_activity).
  remote_access:
    name: Remote access
    description: >-
      webhook (recommended) = reachable through your existing Home Assistant address
      (Nabu Casa, Cloudflare Tunnel, reverse proxy …), nothing else to set up. Installs a
      small helper integration; Home Assistant must be restarted once.
      direct = you route your own HTTPS hostname to port 8100 of this add-on.
  public_url:
    name: Public base URL
    description: >-
      Optional. Only needed if the add-on page cannot work out your public address.
      Webhook mode: your Home Assistant address, e.g. https://home.example.com.
      Direct mode: the hostname you routed to the add-on, e.g. https://garmin.example.com.
  log_level:
    name: Log level
    description: How much the add-on writes to its log.
network:
  8100/tcp: >-
    MCP endpoint for remote access "direct". Leave empty with the default webhook mode.
